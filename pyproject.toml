[project]
name = "pmjc"
version = "0.1.0"
description = "Self-hosted switchboard that connects agents (MCP, REST, CLI) to your services and runs scheduled or event-driven jobs over them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "fastmcp>=2.10",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "keyring>=25",
    "pydantic>=2.7",
    "pyyaml>=6",
    "platformdirs>=4",
    "cryptography>=42",
    "typer>=0.12",
    "python-multipart>=0.0.9",
    "psutil>=5.9",
]

[project.optional-dependencies]
windows = [
    "winrt-runtime>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.0; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications>=3.0; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications.Management>=3.0; sys_platform == 'win32'",
    "winrt-Windows.ApplicationModel>=3.0; sys_platform == 'win32'",
    "winrt-Windows.UI.Core>=3.0; sys_platform == 'win32'",
]
browser = ["playwright>=1.45"]
all = ["pmjc[windows,browser]"]

[project.scripts]
pmjc = "pmjc.cli:app"

[project.entry-points."pmjc.connectors"]
# Third-party packages register connectors here: name = "package.module:ConnectorClass"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmjc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
